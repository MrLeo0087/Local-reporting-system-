<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>(function(){var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Reports — Local Civic Problem Reporting System</title>
<link rel="stylesheet" href="css/style.css?v=9" />
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><span class="brand-icon">🏙️</span>Civic Problem Reporting</a>
  <nav id="nav-links"></nav>
</header>

<main>
  <h1>My Reports</h1>
  <p class="subtitle">Problems you've reported and their current status.</p>

  <p><a class="btn small secondary" href="submit-report.html">+ Report a New Problem</a></p>

  <div id="error-box" class="error-box"></div>
  <div id="report-list" class="report-list"></div>
</main>

<footer class="site-footer">
  E-Governance Laboratory Project — Tribhuvan University
</footer>

<script src="js/api.js?v=8"></script>
<script src="js/auth.js?v=8"></script>
<script>
  requireCitizenLogin();
  renderCitizenHeader("my-reports.html");

  const listEl = document.getElementById("report-list");
  const errorEl = document.getElementById("error-box");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function initials(name) {
    return (name || "?").trim().charAt(0).toUpperCase();
  }

  function reportCardHtml(r) {
    return `
      <div class="card report-card">
        <div class="post-header">
          <div class="avatar">${initials(r.reporter_name)}</div>
          <div class="post-header-text">
            <div class="post-author">${categoryLabel(r.category)} — Ward ${r.ward_no}</div>
            <div class="post-meta">Reported ${formatDate(r.created_at)}</div>
          </div>
          <span class="badge ${r.status}">${statusLabel(r.status)}</span>
        </div>
        <a href="report-detail.html?id=${r.id}">
          <img src="${photoUrl(r.photo_path)}" alt="Photo of reported problem" />
        </a>
        <div class="report-card-body">
          <h3><a href="report-detail.html?id=${r.id}">${categoryLabel(r.category)} — Ward ${r.ward_no}</a></h3>
          <div class="meta-row">📍 Near ${escapeHtml(r.landmark)}</div>
          ${r.rejection_reason ? `<div class="meta-row">Rejection reason: ${statusLabel(r.rejection_reason)}</div>` : ""}
          ${r.expected_completion_date ? `<div class="meta-row">Expected completion: ${r.expected_completion_date}</div>` : ""}
        </div>
      </div>
    `;
  }

  async function loadReports() {
    listEl.innerHTML = spinnerHtml();
    try {
      const reports = await apiFetch("/reports/mine", { authKind: "citizen" });
      if (reports.length === 0) {
        listEl.innerHTML = `<p class="empty-state"><span class="empty-icon">📭</span>You haven't reported any problems yet.</p>`;
        return;
      }
      listEl.innerHTML = reports.map(reportCardHtml).join("");
      animateCardsIn(listEl);
    } catch (err) {
      showBox(errorEl, err.message);
      listEl.innerHTML = "";
    }
  }

  loadReports();
</script>
</body>
</html>
