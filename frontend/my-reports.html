<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>(function(){var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Reports — Local Civic Problem Reporting System</title>
<link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><span class="brand-icon">🏙️</span>Civic Problem Reporting</a>
  <nav id="nav-links"></nav>
</header>

<main>
  <h1>My Reports</h1>
  <p class="subtitle">Problems you've reported and their current status.</p>

  <p class="actions-row">
    <a class="btn small secondary" href="submit-report.html">+ Report a New Problem</a>
    <button type="button" class="btn small secondary" id="edit-profile-btn">✏️ Edit My Profile</button>
  </p>

  <div id="error-box" class="error-box"></div>
  <div id="success-box" class="success-box"></div>
  <div id="report-list" class="report-list"></div>
</main>

<div id="profile-edit-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box card">
    <h3>✏️ Edit My Profile</h3>
    <form id="profile-edit-form">
      <label for="profile_full_name">Full name</label>
      <input type="text" id="profile_full_name" required maxlength="150" />

      <label for="profile_email">Email</label>
      <input type="email" id="profile_email" required maxlength="150" />

      <label for="profile_phone">Phone</label>
      <input type="text" id="profile_phone" required maxlength="20" />

      <label for="profile_password">New password (leave blank to keep current)</label>
      <div class="password-field">
        <input type="password" id="profile_password" minlength="8" />
        <button type="button" class="password-toggle" data-target="profile_password" aria-label="Show password">👁</button>
      </div>

      <div class="actions-row">
        <button type="submit" class="btn">💾 Save Changes</button>
        <button type="button" class="btn small secondary" id="profile-edit-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="report-edit-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box card">
    <h3>✏️ Edit Report</h3>
    <form id="report-edit-form">
      <input type="hidden" id="edit_report_id" />

      <label for="edit_report_category">Category</label>
      <select id="edit_report_category"></select>

      <label for="edit_report_ward_no">Ward number</label>
      <input type="number" id="edit_report_ward_no" min="1" required />

      <label for="edit_report_landmark">Landmark</label>
      <input type="text" id="edit_report_landmark" required maxlength="200" />

      <label for="edit_report_description">Description</label>
      <textarea id="edit_report_description" required rows="4"></textarea>

      <div class="actions-row">
        <button type="submit" class="btn">💾 Save Changes</button>
        <button type="button" class="btn small secondary" id="report-edit-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  E-Governance Laboratory Project — Tribhuvan University
</footer>

<script src="js/api.js?v=9"></script>
<script src="js/auth.js?v=11"></script>
<script>
  requireCitizenLogin();
  renderCitizenHeader("my-reports.html");

  const listEl = document.getElementById("report-list");
  const errorEl = document.getElementById("error-box");
  const successEl = document.getElementById("success-box");
  let lastReports = [];

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function initials(name) {
    return (name || "?").trim().charAt(0).toUpperCase();
  }

  function reportCardHtml(r) {
    const canEdit = r.status === "submitted";
    return `
      <div class="card report-card">
        <div class="post-header">
          <div class="avatar">${initials(r.reporter_name)}</div>
          <div class="post-header-text">
            <div class="post-author">${categoryLabel(r.category)} — Ward ${r.ward_no}</div>
            <div class="post-meta">Reported ${formatDate(r.created_at)}</div>
          </div>
          <span class="badge ${r.status}">${statusLabel(r.status)}</span>
        </div>
        <a href="report-detail.html?id=${r.id}">
          <img src="${photoUrl(r.photo_path)}" alt="Photo of reported problem" />
        </a>
        <div class="report-card-body">
          <h3><a href="report-detail.html?id=${r.id}">${categoryLabel(r.category)} — Ward ${r.ward_no}</a></h3>
          <div class="meta-row">📍 Near ${escapeHtml(r.landmark)}</div>
          ${r.rejection_reason ? `<div class="meta-row">Rejection reason: ${statusLabel(r.rejection_reason)}</div>` : ""}
          ${r.expected_completion_date ? `<div class="meta-row">Expected completion: ${r.expected_completion_date}</div>` : ""}
          ${canEdit
            ? `<div class="actions-row">
                <button type="button" class="btn small secondary" data-report-edit="${r.id}">✏️ Edit</button>
                <button type="button" class="btn small reject" data-report-delete="${r.id}">🗑️ Delete</button>
              </div>`
            : `<p class="helper-text">This report has been reviewed by the department and can no longer be edited or deleted.</p>`
          }
        </div>
      </div>
    `;
  }

  async function loadReports() {
    listEl.innerHTML = spinnerHtml();
    try {
      const reports = await apiFetch("/reports/mine", { authKind: "citizen" });
      lastReports = reports;
      if (reports.length === 0) {
        listEl.innerHTML = `<p class="empty-state"><span class="empty-icon">📭</span>You haven't reported any problems yet.</p>`;
        return;
      }
      listEl.innerHTML = reports.map(reportCardHtml).join("");
      animateCardsIn(listEl);
      listEl.querySelectorAll("[data-report-edit]").forEach((btn) => {
        btn.addEventListener("click", () => openEditReportModal(btn.dataset.reportEdit));
      });
      listEl.querySelectorAll("[data-report-delete]").forEach((btn) => {
        btn.addEventListener("click", () => deleteReport(btn));
      });
    } catch (err) {
      showBox(errorEl, err.message);
      listEl.innerHTML = "";
    }
  }

  const reportEditModal = document.getElementById("report-edit-modal");
  const reportEditForm = document.getElementById("report-edit-form");
  const reportEditCategorySelect = document.getElementById("edit_report_category");

  CATEGORIES.forEach((c) => {
    const opt = document.createElement("option");
    opt.value = c.value;
    opt.textContent = c.label;
    reportEditCategorySelect.appendChild(opt);
  });

  function openEditReportModal(id) {
    const report = lastReports.find((r) => r.id === id);
    if (!report) return;
    document.getElementById("edit_report_id").value = report.id;
    reportEditCategorySelect.value = report.category;
    document.getElementById("edit_report_ward_no").value = report.ward_no;
    document.getElementById("edit_report_landmark").value = report.landmark;
    document.getElementById("edit_report_description").value = report.description;
    showBox(errorEl, "");
    showBox(successEl, "");
    reportEditModal.style.display = "flex";
  }

  function closeEditReportModal() {
    reportEditModal.style.display = "none";
  }

  document.getElementById("report-edit-cancel").addEventListener("click", closeEditReportModal);
  reportEditModal.addEventListener("click", (e) => {
    if (e.target === reportEditModal) closeEditReportModal();
  });

  reportEditForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    showBox(errorEl, "");
    showBox(successEl, "");

    const id = document.getElementById("edit_report_id").value;
    const body = {
      category: reportEditCategorySelect.value,
      ward_no: Number(document.getElementById("edit_report_ward_no").value),
      landmark: document.getElementById("edit_report_landmark").value.trim(),
      description: document.getElementById("edit_report_description").value.trim(),
    };

    const submitBtn = reportEditForm.querySelector('button[type="submit"]');
    setButtonLoading(submitBtn, true);
    try {
      await apiFetch(`/reports/${id}`, { method: "PATCH", body, authKind: "citizen" });
      closeEditReportModal();
      showBox(successEl, "Report updated.");
      loadReports();
    } catch (err) {
      showBox(errorEl, err.message);
    } finally {
      setButtonLoading(submitBtn, false);
    }
  });

  async function deleteReport(btn) {
    const id = btn.dataset.reportDelete;
    if (!confirm("Delete this report? This cannot be undone.")) return;
    showBox(errorEl, "");
    showBox(successEl, "");
    setButtonLoading(btn, true);
    try {
      await apiFetch(`/reports/${id}`, { method: "DELETE", authKind: "citizen" });
      showBox(successEl, "Report deleted.");
      loadReports();
    } catch (err) {
      showBox(errorEl, err.message);
      setButtonLoading(btn, false);
    }
  }

  const profileEditModal = document.getElementById("profile-edit-modal");
  const profileEditForm = document.getElementById("profile-edit-form");

  document.getElementById("edit-profile-btn").addEventListener("click", async () => {
    showBox(errorEl, "");
    showBox(successEl, "");
    try {
      const me = await apiFetch("/citizens/me", { authKind: "citizen" });
      document.getElementById("profile_full_name").value = me.full_name;
      document.getElementById("profile_email").value = me.email;
      document.getElementById("profile_phone").value = me.phone;
      document.getElementById("profile_password").value = "";
      profileEditModal.style.display = "flex";
    } catch (err) {
      showBox(errorEl, err.message);
    }
  });

  function closeProfileEditModal() {
    profileEditModal.style.display = "none";
  }

  document.getElementById("profile-edit-cancel").addEventListener("click", closeProfileEditModal);
  profileEditModal.addEventListener("click", (e) => {
    if (e.target === profileEditModal) closeProfileEditModal();
  });

  profileEditForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    showBox(errorEl, "");
    showBox(successEl, "");

    const body = {
      full_name: document.getElementById("profile_full_name").value.trim(),
      email: document.getElementById("profile_email").value.trim(),
      phone: document.getElementById("profile_phone").value.trim(),
    };
    const password = document.getElementById("profile_password").value;
    if (password) body.password = password;

    const submitBtn = profileEditForm.querySelector('button[type="submit"]');
    setButtonLoading(submitBtn, true);
    try {
      await apiFetch("/citizens/me", { method: "PATCH", body, authKind: "citizen" });
      closeProfileEditModal();
      showBox(successEl, "Profile updated.");
      renderWhoAmI();
    } catch (err) {
      showBox(errorEl, err.message);
    } finally {
      setButtonLoading(submitBtn, false);
    }
  });

  loadReports();
</script>
</body>
</html>
