<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff Login — Local Civic Problem Reporting System</title>
<link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

<header class="site-header">
  <a class="brand" href="login.html"><span class="brand-icon">🏙️</span>Civic Problem Reporting</a>
  <nav id="nav-links"></nav>
</header>

<main>
  <div class="card form-card">
    <h1>Staff / Admin Login</h1>
    <p class="subtitle">For government staff reviewing and resolving reports.</p>

    <div id="error-box" class="error-box"></div>

    <form id="login-form" autocomplete="off">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="off" />

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" required autocomplete="off" />
        <button type="button" class="password-toggle" data-target="password" aria-label="Show password">👁</button>
      </div>

      <button type="submit" class="btn">Log In</button>
    </form>

    <p style="margin-top:16px;"><a href="login.html">Citizen login</a></p>
    <p class="helper-text">Staff and admin accounts are created by an administrator — there is no self-registration.</p>
  </div>
</main>

<footer class="site-footer">
  E-Governance Laboratory Project — Tribhuvan University
</footer>

<script src="js/api.js?v=2"></script>
<script src="js/auth.js?v=7"></script>
<script>
  if (!redirectIfAlreadyLoggedInAsStaff()) {
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error-box");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showBox(errorEl, "");
      const submitBtn = form.querySelector('button[type="submit"]');
      setButtonLoading(submitBtn, true);

      try {
        const data = await apiFetch("/staff/login", {
          method: "POST",
          body: {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          },
        });
        setToken("staff", data.access_token, data.role);
        window.location.href = data.role === "admin" ? "admin-dashboard.html" : "staff-dashboard.html";
      } catch (err) {
        showBox(errorEl, err.message);
        setButtonLoading(submitBtn, false);
      }
    });
  }
</script>
</body>
</html>
