<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>(function(){var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Citizen Login — Local Civic Problem Reporting System</title>
<link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><span class="brand-icon">🏙️</span>Civic Problem Reporting</a>
  <nav id="nav-links"></nav>
</header>

<main>
  <div class="card form-card">
    <h1>Citizen Login</h1>
    <p class="subtitle">Log in to report a problem or check your reports.</p>

    <div id="error-box" class="error-box"></div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" required />
        <button type="button" class="password-toggle" data-target="password" aria-label="Show password">👁</button>
      </div>

      <button type="submit" class="btn">Log In</button>
    </form>

    <p style="margin-top:16px;">Don't have an account? <a href="register.html">Register</a></p>
    <p><a href="staff-login.html">Staff / Admin login</a></p>
  </div>
</main>

<footer class="site-footer">
  E-Governance Laboratory Project — Tribhuvan University
</footer>

<script src="js/api.js?v=4"></script>
<script src="js/auth.js?v=8"></script>
<script>
  if (!redirectIfAlreadyLoggedInAsCitizen()) {
    renderCitizenHeader("login.html");

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error-box");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showBox(errorEl, "");
      const submitBtn = form.querySelector('button[type="submit"]');
      setButtonLoading(submitBtn, true);

      try {
        const data = await apiFetch("/citizens/login", {
          method: "POST",
          body: {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          },
        });
        setToken("citizen", data.access_token, data.role);
        window.location.href = "my-reports.html";
      } catch (err) {
        showBox(errorEl, err.message);
        setButtonLoading(submitBtn, false);
      }
    });
  }
</script>
</body>
</html>
