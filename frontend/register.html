<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — Local Civic Problem Reporting System</title>
<link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

<header class="site-header">
  <a class="brand" href="login.html"><span class="brand-icon">🏙️</span>Civic Problem Reporting</a>
  <nav id="nav-links"></nav>
</header>

<main>
  <div class="card form-card">
    <h1>Create a Citizen Account</h1>
    <p class="subtitle">Register to report local infrastructure problems.</p>

    <div id="error-box" class="error-box"></div>
    <div id="success-box" class="success-box"></div>

    <form id="register-form">
      <label for="full_name">Full name</label>
      <input type="text" id="full_name" required maxlength="150" />

      <label for="email">Email</label>
      <input type="email" id="email" required maxlength="150" />

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" required maxlength="20" />

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" required minlength="8" />
        <button type="button" class="password-toggle" data-target="password" aria-label="Show password">👁</button>
      </div>
      <p class="helper-text">At least 8 characters.</p>

      <button type="submit" class="btn">Create Account</button>
    </form>

    <p style="margin-top:16px;">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<footer class="site-footer">
  E-Governance Laboratory Project — Tribhuvan University
</footer>

<script src="js/api.js?v=2"></script>
<script src="js/auth.js?v=7"></script>
<script>
  if (!redirectIfAlreadyLoggedInAsCitizen()) {
    renderCitizenHeader("register.html");

    const form = document.getElementById("register-form");
    const errorEl = document.getElementById("error-box");
    const successEl = document.getElementById("success-box");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showBox(errorEl, "");
      showBox(successEl, "");
      const submitBtn = form.querySelector('button[type="submit"]');
      setButtonLoading(submitBtn, true);

      try {
        await apiFetch("/citizens/register", {
          method: "POST",
          body: {
            full_name: document.getElementById("full_name").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value,
          },
        });
        showBox(successEl, "Account created! Redirecting to login…");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (err) {
        showBox(errorEl, err.message);
        setButtonLoading(submitBtn, false);
      }
    });
  }
</script>
</body>
</html>
