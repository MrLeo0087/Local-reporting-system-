<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>(function(){var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report Detail — Local Civic Problem Reporting System</title>
<link rel="stylesheet" href="css/style.css?v=10" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><span class="brand-icon">🏙️</span>Civic Problem Reporting</a>
  <nav id="nav-links"></nav>
</header>

<main>
  <p><a href="feed.html">&larr; Back to public feed</a></p>
  <div id="error-box" class="error-box"></div>
  <div id="report-container"></div>
</main>

<footer class="site-footer">
  E-Governance Laboratory Project — Tribhuvan University
</footer>

<script src="js/api.js?v=8"></script>
<script src="js/auth.js?v=9"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/map.js?v=2"></script>
<script>
  renderCitizenHeader("");

  const errorEl = document.getElementById("error-box");
  const container = document.getElementById("report-container");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function statusLogHtml(logs) {
    if (!logs || logs.length === 0) return "<p>No status updates yet.</p>";
    return `<div class="status-log">${logs
      .map(
        (l) => `
        <div class="status-log-entry">
          <div class="log-action">${statusLabel(l.action)}</div>
          <div class="log-meta">${formatDate(l.created_at)}</div>
          ${l.comment ? `<div>${escapeHtml(l.comment)}</div>` : ""}
        </div>`
      )
      .join("")}</div>`;
  }

  async function loadReport() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if (!id) {
      showBox(errorEl, "No report id given.");
      container.innerHTML = "";
      return;
    }

    container.innerHTML = spinnerHtml();
    try {
      const r = await apiFetch(`/reports/${id}`);
      const initial = (r.reporter_name || "?").trim().charAt(0).toUpperCase();
      container.innerHTML = `
        <div class="card" style="display:flex;align-items:center;gap:12px;">
          <div class="avatar" style="width:48px;height:48px;font-size:1.2rem;">${initial}</div>
          <div style="flex:1;">
            <div class="post-author">${escapeHtml(r.reporter_name)}</div>
            <div class="post-meta">${formatDate(r.created_at)}</div>
          </div>
          <span class="badge ${r.status}">${statusLabel(r.status)}</span>
        </div>

        <h1>${categoryLabel(r.category)} — Ward ${r.ward_no}</h1>
        ${r.rejection_reason ? `<p><strong>Rejection reason:</strong> ${statusLabel(r.rejection_reason)}</p>` : ""}
        ${r.expected_completion_date ? `<p><strong>Expected completion:</strong> ${r.expected_completion_date}</p>` : ""}

        <div class="card report-photo">
          <img src="${photoUrl(r.photo_path)}" alt="Photo of reported problem" />
        </div>

        <div class="card">
          <p><strong>Landmark:</strong> ${escapeHtml(r.landmark)}</p>
          <p><strong>Description:</strong> ${escapeHtml(r.description)}</p>
          <p><strong>Reported by:</strong> ${escapeHtml(r.reporter_name)}</p>
          <p><strong>Reported on:</strong> ${formatDate(r.created_at)}</p>
          <p><strong>Last updated:</strong> ${formatDate(r.updated_at)}</p>
          ${r.latitude != null && r.longitude != null ? `<div id="map"></div>` : ""}
        </div>

        <div class="card">
          <h3>Status History</h3>
          ${statusLogHtml(r.status_logs)}
        </div>

        <div class="card" id="messages-card" style="display:none;">
          <h3>Messages</h3>
          <div id="message-thread" class="message-thread"></div>
          <form id="message-form" class="message-form">
            <textarea id="message-input" placeholder="Write a message…" required></textarea>
            <button type="submit" class="btn small">Send</button>
          </form>
          <button type="button" id="ask-progress-btn" class="btn small secondary" style="margin-top:10px;">Ask for Progress Update</button>
        </div>
      `;

      if (r.latitude != null && r.longitude != null) {
        initViewMap("map", r.latitude, r.longitude, `${categoryLabel(r.category)} — Ward ${r.ward_no}`);
      }

      animateCardsIn(container, ".card");
      loadMessages(id);
    } catch (err) {
      showBox(errorEl, err.message);
      container.innerHTML = "";
    }
  }

  function messageBubbleHtml(m) {
    const cls = m.sender_role === "staff" ? "from-staff" : "from-citizen";
    return `
      <div class="message-bubble ${cls}">
        <div class="msg-meta">${escapeHtml(m.sender_name)} • ${formatDate(m.created_at)}</div>
        <div>${escapeHtml(m.body)}</div>
      </div>
    `;
  }

  async function sendMessage(reportId, authKind, body) {
    await apiFetch(`/reports/${reportId}/messages`, { method: "POST", body: { body }, authKind });
    await loadMessages(reportId);
  }

  async function loadMessages(reportId) {
    // Messages are private to the reporting citizen and the assigned staff —
    // whoever's logged in here, try with that token; a 401/403 just means
    // this viewer isn't one of those two, so the card stays hidden.
    const authKind = getToken("citizen") ? "citizen" : getToken("staff") ? "staff" : null;
    if (!authKind) return;

    const messagesCard = document.getElementById("messages-card");
    const threadEl = document.getElementById("message-thread");

    try {
      const messages = await apiFetch(`/reports/${reportId}/messages`, { authKind });
      messagesCard.style.display = "block";
      threadEl.innerHTML = messages.length
        ? messages.map(messageBubbleHtml).join("")
        : `<p class="empty-state" style="padding:16px 0;">No messages yet — say hello.</p>`;
      threadEl.scrollTop = threadEl.scrollHeight;

      const form = document.getElementById("message-form");
      form.onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById("message-input");
        const body = input.value.trim();
        if (!body) return;
        const btn = form.querySelector('button[type="submit"]');
        setButtonLoading(btn, true);
        try {
          input.value = "";
          await sendMessage(reportId, authKind, body);
        } catch (err) {
          showBox(errorEl, err.message);
        } finally {
          setButtonLoading(btn, false);
        }
      };

      const askBtn = document.getElementById("ask-progress-btn");
      askBtn.style.display = authKind === "citizen" ? "inline-block" : "none";
      askBtn.onclick = async () => {
        setButtonLoading(askBtn, true);
        try {
          await sendMessage(reportId, authKind, "Could you share a progress update on this report, please?");
        } catch (err) {
          showBox(errorEl, err.message);
        } finally {
          setButtonLoading(askBtn, false);
        }
      };
    } catch (err) {
      messagesCard.style.display = "none";
    }
  }

  loadReport();
</script>
</body>
</html>
